# Render Blueprint. Deploy: Render dashboard > New > Blueprint > select this repo.
# Plan: free (see below). A free web service spins down after 15 minutes without traffic (~1 minute to
# wake), and its Postgres expires after 30 days: upgrade both before a live demo. See https://render.com/docs/free
# Field names checked against https://render.com/docs/blueprint-spec for healthCheckPath and
# numInstances; dockerfilePath and dockerContext were NOT re-verified (check on first deploy).
services:
  - type: web
    name: mochi-backend
    runtime: docker
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: .
    plan: free
    numInstances: 1 # the session is in memory (words and voices are in Postgres): one instance, one worker
    healthCheckPath: /healthz
    envVars:
      - key: MOCHI_AGORA_MODE
        value: real
      - key: MOCHI_SILENCE_STRATEGY
        value: empty_reply
      - key: MOCHI_ENABLE_DEV_ROUTES
        value: "false" # flip to "true" only if you need /dev/... during the demo
      - key: MOCHI_PUBLIC_URL
        sync: false # set to this service's https URL after the first deploy
      - key: DATABASE_URL
        sync: false # the INTERNAL URL of mochi-db (Render dashboard > mochi-db > Connections). Free: expires 2026-12-21
      - key: MOCHI_TURN_KEY
        sync: false
      - key: MOCHI_DEVICE_KEY
        sync: false # the Pi sends it as "Authorization: Bearer <key>" on /status and /voices
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_REST_KEY
        sync: false
      - key: AGORA_REST_SECRET
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: MOCHI_MODEL_BASE_URL
        value: https://api.openai.com/v1
      - key: MOCHI_MODEL_NAME
        value: gpt-4o-mini
      - key: MOCHI_CHANNEL
        value: mochi-demo
      # Agora-managed speech vendors: no vendor keys needed (tested against real Agora, see VERIFIED.md)
      # Ears (.env.example, DECISIONS D-25): OpenAI transcription when MODEL_API_KEY is set (the key then goes
      # to Agora with each session start), otherwise ARES with the lexicon as keywords.
      # Ears and voice: the configuration tried by voice on Mochi Home on 2026-11-21 (config/presets/likely.env,
      # DECISIONS D-40). Before: openai (gpt-4o-transcribe), lexicon not named, MiniMax voice, no latency flags.
      - key: MOCHI_ASR_VENDOR
        value: ares
      - key: MOCHI_ASR_LANGUAGE
        value: en-US
      - key: MOCHI_ARES_LANGUAGE
        value: en-US,pt-BR
      - key: MOCHI_ASR_LEXICON_WORDS
        value: "true" # ARES hears adiar and guarda-chuva inside English only when they are named (D-40); the D-36 risk is open
      - key: MOCHI_INTERRUPTION
        value: append # Mochi finishes its answer before the next sentence gets its turn (D-38)
      - key: MOCHI_ASR_KEYWORDS
        value: '["Mochi","Oi Mochi","guarda chuva","saca rolhas"]'
      - key: MOCHI_ASR_CREDENTIAL_MODE
        value: ""
      - key: MOCHI_ASR_PARAMS
        value: "{}"
      - key: MOCHI_TTS_VENDOR
        value: cartesia # language fixed to "en" for the session; billing under Agora's managed key is unverified
      - key: MOCHI_TTS_CREDENTIAL_MODE
        value: managed
      - key: MOCHI_TTS_PARAMS
        value: '{"model_id":"sonic-3.6","voice":{"mode":"id","id":"9626c31c-bec5-4cca-baa8-f8ba9e84c8bc"},"output_format":{"container":"raw","sample_rate":44100},"language":"en"}'
      - key: MOCHI_CANCEL_STALE_TURNS
        value: "true" # the work of a turn Agora abandoned or a newer one replaced is dropped (D-37)
      - key: MOCHI_CHARACTER_HEDGE_SECONDS
        value: "1.0" # Mochi's line is asked a second time when the first answer is this late (D-37)
      - key: MOCHI_END_OF_SPEECH_SILENCE_MS
        value: "600" # pause that ends a turn; below 600 risks splitting 'trails off... um' turns
      - key: MOCHI_AGENT_IDLE_TIMEOUT_SECONDS
        value: "60" # agent leaves 60 s after the Pi does (billing guard)
      - key: MOCHI_CORS_ORIGINS
        value: "*"
      - key: MOCHI_LOG_LEVEL
        value: INFO
  # The web app (apps/web): nginx serves it and proxies /api, /ws and /healthz to mochi-backend, so the
  # browser only ever talks to this service's own origin (it needs https for the microphone).
  # dockerfilePath and dockerContext are NOT re-verified (check on first deploy), like the backend's.
  - type: web
    name: mochi-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    plan: free # spins down after 15 minutes without traffic, like the backend
    healthCheckPath: /web-healthz
    envVars:
      # fromService (property: host) could fill this in, but it gives a host without https:// and was
      # not verified here: set it by hand after the backend's first deploy.
      - key: BACKEND_URL
        sync: false # the https URL of mochi-backend, no trailing slash, e.g. https://mochi-backend-xxxx.onrender.com
