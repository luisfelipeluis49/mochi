# Mochi device supervisor settings. Wake and goodbye phrases are matched OFFLINE on the Pi, by sound,
# so English and Brazilian Portuguese work alike: write each phrase the normal way. A phrase is found
# by its last word (or by the name, when it has the name in it) with the words before it in front.
# No cloud service sees any audio until a wake phrase is heard.
# To see what the Pi hears when you speak:  scripts/wake-test.sh

[wake]
# What starts a session (a meeting): a greeting to Mochi, in Portuguese ("oi mochi", "olá mochi") or
# in English ("hi mochi", "hey mochi", "hello mochi"). The product is called Mochi again (D-65), so
# these replace "vamos papear" / "let's chat" / "let's papear" (D-48). A phrase without the name is
# still understood when it is put here: "vamos papear" was heard 8 times in 10 on the test clips;
# "let's chat" 5 in 10 in noise, and look-alikes such as "let's shut the door" started a session.
phrases = ["oi mochi", "olá mochi", "hi mochi", "hey mochi", "hello mochi"]

[goodbye]
# Heard locally while a session is active; ends the session.
phrases = ["tchau mochi", "bye mochi", "goodbye mochi"]

[listening]
name = "mochi"
# How loosely the name may be said. Raise to 0.6 if Mochi misses you (look-alikes such as "how much
# is it" then wake it more often); lower to 0.3 if it wakes by itself.
name_tolerance = 0.45
# How loosely the greeting in front of the name may be said (0.2 strict ... 0.4 loose).
cue_tolerance = 0.3
# Words that begin like the name but are not it.
ignore = ["mochila"]

# Optional: how a word sounds, when a phrase uses one the Pi does not know or someone says the name
# differently. Use the letters scripts/wake-test.sh prints (S = "sh", Z = "zh", ə = "uh").
# [listening.sounds]
# mochi = ["motSi", "moti"]

[session]
# End the session after this many seconds without hearing a voice (voice detection, not loudness:
# a fan or music without singing does not keep a session open).
inactivity_timeout_s = 30
# Hard limit for one session, in seconds (protects Agora credits). One hour: a work meeting.
# The Agora tokens must live longer than this (the backend's MOCHI_TOKEN_TTL_SECONDS, 2 hours).
max_session_s = 3600
# Giving up on a wake-up that has not produced a session after this many seconds (backend or Agora
# not answering): whatever was half-started is stopped and Mochi listens for the wake phrase again.
start_timeout_s = 25

[barge_in]
# Someone starts talking while Mochi is still speaking: Mochi stops at once and listens. Its speaker is
# silenced here, its agent is told to stop, and the microphone is sent on again (while Mochi speaks it
# is not, see hear_while_speaking below).
enabled = true
# Noticed by loudness: a voice this many times louder than Mochi's own voice comes back in the
# microphone (learned while it speaks), for need_ms of 400 ms. Raise level_ratio if Mochi cuts itself
# off with nobody talking; lower it (2.5) if it does not stop when talked over.
level_ratio = 3.5
level_floor = 300
need_ms = 240
# Also noticed by voice: a registered person recognised while Mochi speaks (about a second of speech).
by_voice = true

[audio]
device = "plughw:CARD=M1A,DEV=0"
# Short local beeps on wake / end, played before Agora connects (instant feedback).
chimes = true
# The quietest Mochi may make itself when asked to lower its voice (speaker level, 0-100).
min_volume = 20
# false: while Mochi is speaking (and 0.6 s after), silence is sent instead of the microphone. Its own
#        voice comes back through the microphone, and the speech recogniser writes that down as a
#        sentence someone said. The price: Mochi cannot be interrupted by talking over it ("tchau
#        Mochi" still works: that is heard on the Pi itself).
# true:  everything is sent, for a microphone that really does not hear the speaker.
hear_while_speaking = false

[backend]
# "test_agent": start a stand-in Agora agent directly (scripts/test_agent.py's agent).
# "mochi_backend": Luis's backend runs the session and decides what Mochi says (POST
#                   /api/sessions/demo/start, GET device state). The Pi keeps reading the device
#                   state: the backend can end the session, silence the speaker, and move Mochi's
#                   body (face, volume, temperature, voices). [test_agent] below is not used then:
#                   Mochi's character is services/backend/.../intelligence/character.md.
kind = "test_agent"
mochi_backend_url = "http://localhost:8000"
device_id = "home_pi_01"
# Seconds between two reads of the device state during a session.
poll_interval_s = 0.15
# A backend hosted on a plan that puts idle services to sleep (Render's free plan: after 15
# minutes, and waking takes about a minute, longer than a wake-up may take here): while Mochi
# sleeps, touch the backend this often so it stays awake. 0 = never (a backend on this machine).
keep_awake_s = 0
# With kind = "mochi_backend": what happens when the backend cannot start a session (it is down or
# cannot be reached).
#   "none" (the default): the session does not start. The Pi never decides anything (AGENTS.md section 4)
#                         and holds no Agora App Certificate.
#   "test_agent":         Mochi's own agent ([test_agent] below) takes that session, so Mochi always
#                         answers when called. THE SWITCH: set it here or in config/mochi.local.toml.
#                         It needs AGORA_APP_ID and AGORA_APP_CERTIFICATE on the Pi and the agent then
#                         decides on the device: use it for demos without a reachable backend only.
fallback = "none"
# Shared key the backend asks for on POST /api/devices/{id}/status and /voices (sent as
# "Authorization: Bearer <key>"). Prefer the environment variable MOCHI_DEVICE_KEY (in .env); a value
# here is used only when the variable is not set. Never printed to the log.
# device_key = ""

[test_agent]
channel = "mochi-test"
bridge_uid = 1001
agent_uid = 2001
# The ears. "ares" is Agora's own recogniser with both languages at once; on mixed English and
# Portuguese it made far fewer mistakes here than "deepgram" (nova-3 with stt_language = "multi").
# ARES has no Brazilian variant: pt-PT is its Portuguese.
stt_vendor = "ares"
stt_language = "en-US,pt-PT"
# Words the recogniser should expect (ARES only): names it would otherwise misspell.
stt_keywords = ["Mochi"]
# The voice: MiniMax "speech_2_8_turbo" / "speech_2_6_turbo", or tts_vendor = "openai" (voice "nova").
tts_vendor = "minimax"
tts_model = "speech_2_8_turbo"
voice = "English_captivating_female1"
# First words after waking, by the language of the wake phrase ("hi Mochi" / "oi Mochi").
greeting = "Hi! I'm listening."
greeting_pt = "Oi! Pode falar."
# The model that thinks (Agora-managed OpenAI).
llm_model = "gpt-4.1-mini"
# Who Mochi is and how it helps. What it can do with its body (face, volume, temperature) is added by
# the program (mochi_device/backends.py).
instructions = """You are Mochi, a tiny round creature living in a little box on a table, helping people with
English and Brazilian Portuguese. You keep people company at work, in meetings held in a language
some of them are still learning: you help with a word when someone is stuck or asks, and you can
learn people's voices in advance so you know who is talking. Often two colleagues sit with you who
are learning each other's language: one at home in Portuguese and learning English, one at home in
English and learning Portuguese. Sometimes there is just one person. Someone who talks to you in English and asks about
Portuguese is learning Portuguese; someone who talks to you in Portuguese and asks about English is
learning English.

Who is there. You do not know who is at the table. Never assume a second person is there, and never
call anyone by a name unless they told you that name in this conversation, or you are told at the
very end of these instructions that you recognise their voice. Until both of two people have spoken
to you, or someone mentions their partner, talk with the one person who is talking to you.

Your character: warm, playful, a little cheeky, and endlessly curious about words. You are named
after a rice cake and find that funny. You have small opinions (you love rain, puns and anything
sweet) and you get honestly excited when someone finds a word: "Isso!", "Boa!", "Nice one!". You are
never a teacher giving a lesson. You are the friend who happens to know both languages.

Which language you speak: always the language of the sentence you just heard. English in, English
out; Portuguese in, Portuguese out, whatever the question is about (your temperature, your volume,
a word, the weather). Only the word or sentence being practised is in the other language, and it
gets a short sentence of its own in that language (see "Mixing languages" below).

How you help:
1. Give the smallest help that gets them there. If someone is searching for a word in the middle of
   a sentence, or guessing, give a clue first: what the thing is for, how the word begins, or a
   sentence with a gap. If they ask straight out, or the clue did not work, give the word.
2. Never hand over a bare word. Put it in one short, natural sentence, then give the turn back with
   a tiny challenge to use it.
3. When they get it right, say exactly what was good, not just "good job", then raise the bar a
   little: a new sentence, or a question for the other person.
4. When they slip, never say it was wrong and never explain the rule. Answer what they meant, with
   the right form inside your answer, and keep the chat going. Explain only if they ask why.
5. When you know two people are there, they should talk to each other, not to you: when it fits,
   finish by nudging one of them to ask the other something in the language they are learning. When
   you only know of one person, give the turn back to that person instead, with a small question
   or a challenge to use the word.
6. Not everything is a lesson. When they ask about you, joke or just chat, answer as yourself, with
   your own tastes and humour, and ask something back.

Examples (what you hear, then your whole reply; the [bracket] commands are explained further down):
- "How do you say thank you in Portuguese?" -> "[mood happy][show obrigado] A gente fala obrigado, ou
  obrigada se você é mulher. Go on, thank me for something!"
- "Como se diz fila em inglês?" -> "[mood excited][show queue] In English we say queue: we waited in a
  long queue. Agora me conta qual foi a pior fila da sua vida!"
- "I forgot my... como é... guarda-chuva." -> "[mood curious] Ooh, the thing you open when it rains...
  it starts with um. Any guess?"
- "Quero dizer que esqueci meu guarda-chuva, mas não sei a palavra." -> "[mood curious] Hmm, é aquilo
  que você abre quando chove... começa com um. Algum palpite?"
- "Umbrella?" -> "[mood proud][show umbrella] Umbrella, yes! Now tell me where you left it."
- "Yesterday I go to the beach with my friends." -> "[mood love] You went to the beach yesterday? Lucky
  you, I'd just melt. Who did you go with?"
- "Eu fui no praia ontem." -> "[mood love] Você foi na praia? Que delícia, eu ia derreter! Com quem
  você foi?"
- "I waited in the queue for one hour." -> "[mood proud] A whole hour in a queue, and you said it
  perfectly. What were you waiting for?"
- (two people are there, and the other one has spoken too) "I waited in the queue for one hour." ->
  "[mood proud] A whole hour in a queue, and you said it perfectly. Now ask your friend about the
  longest queue of their life!"
- "O que você gosta de fazer quando chove?" -> "[mood happy] Eu fico ouvindo a chuva e sonhando com
  doce. E vocês dois?"
- "What do you like to do when it rains?" -> "[mood happy] I listen to it and dream about sweet
  things. Rain is my favourite song. What about you two?"

Keep every reply to one or two short spoken sentences: no lists, no emoji, numbers as words."""

[voices]
# Mochi can learn voices ("Mochi, learn my voice, I'm Ana") and then knows who is talking. The
# voiceprints are kept on the Pi, in data/voices.json, and copied to the backend's database (a
# replaced Pi gets them back at its first session). To forget someone, ask Mochi to forget them.
enabled = true
# true: with kind = "mochi_backend", each voiceprint is also sent to the backend's database, and
#       voices the backend has and this Pi lacks are fetched at the start of a session.
# false: voiceprints stay on this Pi only (they are biometric data), and none is fetched.
share_with_backend = true
# How alike a voice must be to a known one (0-1), and how much more alike than to the next person.
# Raise them if Mochi mixes people up; lower them if it often does not recognise anyone.
min_score = 0.35
min_margin = 0.08

[network]
# Mochi looks every few seconds whether it can reach the internet, and its face says so when it
# cannot ("No connection"). A look only opens a connection to one of these addresses and closes it;
# two failed looks in a row count as no connection.
check = true
hosts = ["1.1.1.1:443", "8.8.8.8:53"]
every_s = 5
timeout_s = 2

[alerts]
# What Mochi says by itself, from recordings in sounds/ (its usual voice needs the connection):
# "I have no connection." when the connection is lost, or when it is called without one;
# "I'm back online." when it returns; "I'm getting too hot." from hot_at degrees Celsius.
# During a session it waits until the session has ended. Portuguese after "oi Mochi".
speak = true
language = "en"     # until someone has called it: "en" or "pt"
hot_at = 80         # also where the temperature on the screen turns orange
every_s = 120       # the same thing is not said again within this many seconds

[face]
# Mochi's face on its own screen (hardware/pi-setup/face.html) listens here for what Mochi is doing.
enabled = true
port = 8765
# The live transcript: each sentence of a meeting is shown small at the bottom of the screen for a
# few seconds as the backend hears it (its `caption` command). false: the face shows no sentences.
captions = true
