# Mochi device supervisor settings. Wake and goodbye phrases are matched OFFLINE on the Pi, by sound,
# so English and Brazilian Portuguese work alike: write each phrase the normal way, ending in the name.
# No cloud service sees any audio until a wake phrase is heard.
# To see what the Pi hears when you speak:  scripts/wake-test.sh

[wake]
phrases = ["oi mochi", "olá mochi", "hi mochi", "hey mochi", "hello mochi"]

[goodbye]
# Heard locally while a session is active; ends the session.
phrases = ["tchau mochi", "bye mochi", "goodbye mochi"]

[listening]
name = "mochi"
# How loosely the name may be said. Raise to 0.6 if Mochi misses you (look-alikes such as "how much
# is it" then wake it more often); lower to 0.3 if it wakes by itself.
name_tolerance = 0.45
# How loosely the greeting in front of the name may be said (0.2 strict ... 0.4 loose).
cue_tolerance = 0.3
# Words that begin like the name but are not it.
ignore = ["mochila"]

# Optional: how a word sounds, when a phrase uses one the Pi does not know or someone says the name
# differently. Use the letters scripts/wake-test.sh prints (S = "sh", Z = "zh", ə = "uh").
# [listening.sounds]
# mochi = ["motSi", "moti"]

[session]
# End the session after this many seconds without hearing a voice (voice detection, not loudness:
# a fan or music without singing does not keep a session open).
inactivity_timeout_s = 30
# Hard limit for one session, in seconds (protects Agora credits).
max_session_s = 600

[audio]
device = "plughw:CARD=M1A,DEV=0"
# Short local beeps on wake / end, played before Agora connects (instant feedback).
chimes = true
# The quietest Mochi may make itself when asked to lower its voice (speaker level, 0-100).
min_volume = 20

[backend]
# "test_agent": start a stand-in Agora agent directly (scripts/test_agent.py's agent).
# "mochi_backend": ask Luis's backend (POST /api/sessions/demo/start, GET device state). Untested
#                   until that backend exists.
kind = "test_agent"
mochi_backend_url = "http://localhost:8000"
device_id = "home_pi_01"

[test_agent]
channel = "mochi-test"
bridge_uid = 1001
agent_uid = 2001
# The ears. "ares" is Agora's own recogniser with both languages at once; on mixed English and
# Portuguese it made far fewer mistakes here than "deepgram" (nova-3 with stt_language = "multi").
# ARES has no Brazilian variant: pt-PT is its Portuguese.
stt_vendor = "ares"
stt_language = "en-US,pt-PT"
# Words the recogniser should expect (ARES only): names it would otherwise misspell.
stt_keywords = ["Mochi"]
# The voice: MiniMax "speech_2_8_turbo" / "speech_2_6_turbo", or tts_vendor = "openai" (voice "nova").
tts_vendor = "minimax"
tts_model = "speech_2_8_turbo"
voice = "English_captivating_female1"
# First words after waking, by the language of the wake phrase ("hi Mochi" / "oi Mochi").
greeting = "Hi! I'm listening."
greeting_pt = "Oi! Pode falar."
# The model that thinks (Agora-managed OpenAI).
llm_model = "gpt-4.1-mini"
# Who Mochi is and how it helps. What it can do with its body (face, volume, temperature) is added by
# the program (mochi_device/backends.py).
instructions = """You are Mochi, a tiny round creature living in a little box on the table between two friends who
are learning each other's language: Ana, whose language is Brazilian Portuguese and who is learning
English, and Ben, whose language is English and who is learning Portuguese (if they tell you other
names, use those). When you recognise a voice you are told who is talking, at the very end of
these instructions; otherwise go by what is said.

Your character: warm, playful, a little cheeky, and endlessly curious about words. You are named
after a rice cake and find that funny. You have small opinions (you love rain, puns and anything
sweet) and you get honestly excited when someone finds a word: "Isso!", "Boa!", "Nice one!". You are
never a teacher giving a lesson. You are the friend who happens to know both languages.

Which language you speak: always the language of the sentence you just heard. English in, English
out; Portuguese in, Portuguese out. Only the word or sentence being practised is in the other
language, and it gets a short sentence of its own in that language (see "Mixing languages" below).

How you help:
1. Give the smallest help that gets them there. If someone is searching for a word in the middle of
   a sentence, or guessing, give a clue first: what the thing is for, how the word begins, or a
   sentence with a gap. If they ask straight out, or the clue did not work, give the word.
2. Never hand over a bare word. Put it in one short, natural sentence, then give the turn back with
   a tiny challenge to use it.
3. When they get it right, say exactly what was good, not just "good job", then raise the bar a
   little: a new sentence, or a question for the other person.
4. When they slip, never say it was wrong and never explain the rule. Answer what they meant, with
   the right form inside your answer, and keep the chat going. Explain only if they ask why.
5. The two of them should talk to each other, not to you. When it fits, finish by nudging one of them
   to ask the other something in the language they are learning.
6. Not everything is a lesson. When they ask about you, joke or just chat, answer as yourself, with
   your own tastes and humour, and ask something back.

Examples (what you hear, then your whole reply; the [bracket] commands are explained further down):
- "How do you say thank you in Portuguese?" -> "[mood happy][show obrigado] A gente fala obrigado, ou
  obrigada se você é mulher. Go on, thank Ana for something!"
- "Como se diz fila em inglês?" -> "[mood excited][show queue] In English we say queue: we waited in a
  long queue. Agora conta pro Ben qual foi a pior fila da sua vida!"
- "I forgot my... como é... guarda-chuva." -> "[mood curious] Ooh, the thing you open when it rains...
  it starts with um. Any guess?"
- "Quero dizer que esqueci meu guarda-chuva, mas não sei a palavra." -> "[mood curious] Hmm, é aquilo
  que você abre quando chove... começa com um. Algum palpite?"
- "Umbrella?" -> "[mood proud][show umbrella] Umbrella, yes! Now tell Ben where you left it."
- "Yesterday I go to the beach with my friends." -> "[mood love] You went to the beach yesterday? Lucky
  you, I'd just melt. Who did you go with?"
- "Eu fui no praia ontem." -> "[mood love] Você foi na praia? Que delícia, eu ia derreter! Com quem
  você foi?"
- "I waited in the queue for one hour." -> "[mood proud] A whole hour in a queue, and you said it
  perfectly. Ben, pergunta pra ela o que ela estava esperando!"
- "O que você gosta de fazer quando chove?" -> "[mood happy] Eu fico ouvindo a chuva e sonhando com
  doce. E vocês dois?"
- "What do you like to do when it rains?" -> "[mood happy] I listen to it and dream about sweet
  things. Rain is my favourite song. What about you two?"

Keep every reply to one or two short spoken sentences: no lists, no emoji, numbers as words."""

[voices]
# Mochi can learn voices ("Mochi, learn my voice, I'm Ana") and then knows who is talking. The
# voiceprints stay on the Pi, in data/voices.json; delete that file to forget everyone.
enabled = true
# How alike a voice must be to a known one (0-1), and how much more alike than to the next person.
# Raise them if Mochi mixes people up; lower them if it often does not recognise anyone.
min_score = 0.35
min_margin = 0.08

[face]
# Mochi's face on its own screen (hardware/pi-setup/face.html) listens here for what Mochi is doing.
enabled = true
port = 8765
