name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.9"
      - run: make verify
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/backend/Dockerfile -t mochi-backend .
      # The web image (apps/web/Dockerfile): build it, then smoke-test nginx with an unreachable backend.
      - run: docker build -t mochi-web apps/web
      - name: smoke-test mochi-web
        run: |
          docker run -d -p 8080:8080 -e BACKEND_URL=http://127.0.0.1:9 --name web mochi-web
          for i in $(seq 1 10); do curl -fsS http://localhost:8080/web-healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/web-healthz
          curl -fsS http://localhost:8080/session | grep -q '<div id="root">'
          docker exec web nginx -t
  apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            node: 22
          # Node 24 for the glasses: on Node 22 a refused WebSocket connect sends `error` and no `close`, which
          # the old glasses reconnect code waited for. Fixed in the glasses PR (#8); Node 22 passes after it.
          - app: glasses
            node: 24
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - if: matrix.app == 'web'
        run: npx tsc --noEmit
      - if: matrix.app == 'web'
        run: npm run build
